{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
# This SA exists only to keep the pod off the API server: no RBAC bindings,
# no token mounted.
automountServiceAccountToken: false
metadata:
  name: {{ include "goloom.serviceAccountName" . }}
  labels:
    {{- include "goloom.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
